<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reBot Arm B601-RS · MuJoCo WASM M2</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main class="app">
    <section class="viewport" id="viewport">
      <div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite">
        <div class="loading-ring" aria-hidden="true"></div>
        <p class="loading-title" data-i18n="loading.title">正在构建数字孪生</p>
        <p class="loading-text" id="loading-text">正在启动…</p>
        <div class="loading-progress" id="loading-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="loading-progress-track" aria-hidden="true">
            <div class="loading-progress-fill" id="loading-progress-fill"></div>
          </div>
          <span class="loading-progress-value" id="loading-progress-value">0%</span>
        </div>
      </div>
      <div class="callouts" id="callouts"></div>
      <div id="drag-cluster" class="drag-cluster">
        <div id="drag-marker" class="drag-marker" data-i18n-title="marker.tcp" title="拖拽 TCP"></div>
        <div class="gripper-fab">
          <button type="button" id="gripper-open" data-i18n="btn.open">开</button>
          <button type="button" id="gripper-close" data-i18n="btn.close">合</button>
        </div>
      </div>
    </section>
    <aside class="panel">
      <p class="eyebrow" data-i18n="panel.eyebrow">M2 物理演示</p>
      <h1 data-i18n="panel.title">B601-RS MuJoCo WASM</h1>
      <p class="status" id="status">正在启动…</p>
      <p class="hint" data-i18n="panel.hint">在画面上按住 TCP 标记拖动即可移动末端；点旁边的开/合控制夹爪。</p>
      <div class="button-row">
        <button type="button" id="toggle-drag" data-i18n="btn.dragOn">启用 TCP 拖拽</button>
        <button type="button" id="reset" data-i18n="btn.reset">复位</button>
        <button type="button" id="toggle-guides" data-i18n="btn.guidesOn" aria-pressed="false">显示全部引导线</button>
        <select id="lang-select" class="lang-select" aria-label="选择语言">
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>
    </aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
